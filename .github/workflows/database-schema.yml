name: Database schema

on:
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-schema.yml"
  push:
    branches: [main]
    paths:
      - "database/**"
      - ".github/workflows/database-schema.yml"

jobs:
  mariadb-11-4:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: fchinac_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Apply schema twice to verify repeatability
        env:
          MYSQL_PWD: ci-root-only
        run: |
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/001_initial_schema.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/003_auth_schema.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/004_language_management.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/005_member_management.sql
          for migration in database/migrations/{006_legacy_supported_locales,007_registration_profile_and_legal,008_legacy_password_scheme,009_admin_content_and_lectures,010_additional_supported_locales,011_update_english_agreement_copy,012_sync_content_translations,013_update_president,014_standardize_english_fallback,015_lecture_notes_board,016_map_youtube_lecture_videos}.sql; do
            mariadb -h127.0.0.1 -uroot fchinac_dev < "$migration"
          done
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/001_initial_schema.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/003_auth_schema.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/004_language_management.sql
          mariadb -h127.0.0.1 -uroot fchinac_dev < database/migrations/005_member_management.sql
          for migration in database/migrations/{006_legacy_supported_locales,007_registration_profile_and_legal,008_legacy_password_scheme,009_admin_content_and_lectures,010_additional_supported_locales,011_update_english_agreement_copy,012_sync_content_translations,013_update_president,014_standardize_english_fallback,015_lecture_notes_board,016_map_youtube_lecture_videos}.sql; do
            mariadb -h127.0.0.1 -uroot fchinac_dev < "$migration"
          done

      - name: Validate storage engine, charset, and seed data
        env:
          MYSQL_PWD: ci-root-only
        run: |
          result=$(mariadb -h127.0.0.1 -uroot -N -e "
            SELECT CONCAT(
              COUNT(*), ':',
              SUM(ENGINE='InnoDB'), ':',
              SUM(TABLE_COLLATION LIKE 'utf8mb4%')
            )
            FROM information_schema.TABLES
            WHERE TABLE_SCHEMA='fchinac_dev';")
          test "$result" = "31:31:31"
          test "$(mariadb -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM fchinac_dev.locales;")" = "15"
          test "$(mariadb -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM fchinac_dev.roles;")" = "5"
          test "$(mariadb -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM fchinac_dev.boards WHERE board_key='lecture_notes';")" = "1"
          test "$(mariadb -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM fchinac_dev.lecture_lessons WHERE youtube_video_id IS NOT NULL AND is_available=TRUE;")" = "655"
          test "$(mariadb -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM fchinac_dev.lecture_lessons WHERE youtube_video_id IS NULL AND is_available=FALSE;")" = "31"
